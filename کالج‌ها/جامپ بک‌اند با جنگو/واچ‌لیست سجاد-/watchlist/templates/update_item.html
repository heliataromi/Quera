<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <title>ویرایش {{ item.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        .card-horizontal {
            display: flex;
            flex-direction: row;
        }

        .card-horizontal img {
            width: 300px;
            border-radius: 0.5rem;
        }

        @media (max-width: 768px) {
            .card-horizontal {
                flex-direction: column !important;
            }

            .card-horizontal img {
                width: 100%;
            }
        }
    </style>
</head>

<body class="bg-light py-5" dir="rtl" style="font-family: 'Vazir', sans-serif;">
    <div class="container">

        <div id="message-box" class="w-100 d-none"></div>

        <div class="card card-horizontal shadow-sm p-3">
            <!-- Form -->
            <img src="{{ item.poster.url }}" alt="پوستر {{ item.title }}">

            <div class="card-body w-100">
                <h4 class="card-title mb-4">ویرایش آیتم</h4>
                <form id="edit-form">
                    <div class="mb-3">
                        <label for="title" class="form-label">عنوان</label>
                        <input type="text" class="form-control" id="title" value="{{ item.title }}">
                    </div>

                    <div class="mb-3">
                        <label for="type" class="form-label">نوع</label>
                        <select class="form-select" id="type">
                            <option value="M" {% if item.type == 'M' %}selected{% endif %}>فیلم</option>
                            <option value="S" {% if item.type == 'S' %}selected{% endif %}>سریال</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="url" class="form-label">لینک</label>
                        <input type="url" class="form-control" id="url" value="{{ item.url }}">
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="is_watched" {% if item.is_watched%}checked{% endif %}>
                        <label class="form-check-label" for="is_watched">دیده شده</label>
                    </div>

                    <div class="d-flex flex-column flex-md-row justify-content-between gap-3">
                        <button type="submit" class="btn btn-primary w-100">ثبت تغییرات</button>
                        <a href="/{{ item.id }}/" class="btn btn-danger w-100">بازگشت</a>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <script>
        const form = document.getElementById('edit-form');
        const itemId = {{ item.id }};
        const csrfToken = '{{ csrf_token }}';

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const data = {
                title: document.getElementById('title').value,
                type: document.getElementById('type').value,
                url: document.getElementById('url').value,
                is_watched: document.getElementById('is_watched').checked
            };

            fetch(`/api/update/${itemId}/`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify(data)
            })
                .then(res => res.json())
                .then(data => {
                    const messageBox = document.getElementById('message-box');

                    messageBox.innerHTML = data.message;
                    messageBox.className = `alert mt-3 ${data.is_ok ? 'alert-success' : 'alert-danger'}`;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                })
                .catch(err => {
                    const messageBox = document.getElementById('message-box');
                    messageBox.innerHTML = "مشکلی در ارسال درخواست وجود داشت";
                    messageBox.className = "alert alert-danger mt-3";
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });

        });
    </script>

</body>

</html>
