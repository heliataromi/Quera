{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}StoryBoard{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.003/Farsi-Digits/Vazirmatn-FD-font-face.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'style.css' %}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="{% url 'blog:post_list' %}">
        <span class="logo">📚</span> <span>StoryBoard</span>
      </a>
      <nav class="nav">
        <a href="{% url 'blog:post_list' %}">خانه</a>
        <a href="{% url 'blog:post_create' %}">پست جدید</a>
      </nav>
    </div>
  </header>

  {% if messages %}
  <div class="container messages">
    {% for message in messages %}
      <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  </div>
  {% endif %}

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container">
      <p>ساخته‌شده با ❤️ برای تمرین StoryBoard — <a href="https://quera.org" target="_blank" rel="noopener">Quera</a></p>
    </div>
  </footer>

  <script>
    (function(){
      const root = document.documentElement;
      const saved = localStorage.getItem('theme');
      if (saved) root.setAttribute('data-theme', saved);
      document.getElementById('theme-toggle').addEventListener('click', function(){
        const cur = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', cur);
        localStorage.setItem('theme', cur);
      });
    })();
  </script>
</body>
</html>
